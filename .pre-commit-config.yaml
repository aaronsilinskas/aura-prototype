repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter
        description: Enforce the module layering contracts declared in pyproject.toml.
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        description: Type-check the packages, and their tests, configured in pyproject.toml.
        entry: uv run mypy
        language: system
        pass_filenames: false
