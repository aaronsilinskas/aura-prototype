repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter
        description: Enforce the module layering contracts declared in pyproject.toml.
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: basedpyright
        name: basedpyright
        description: Type-check against .basedpyright/baseline.json; only errors not in the baseline fail.
        entry: uv run basedpyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
