repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  # GitHub validates .github/dependabot.yml only once it reaches main, where a broken
  # config silently stops Dependabot; this catches it before then, at commit time and in CI.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-dependabot
  - repo: local
    hooks:
      # ruff runs from the uv environment, so commits and CI use the one version in uv.lock.
      # --force-exclude applies pyproject.toml's exclude to the files pre-commit passes.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown]
        require_serial: true
      - id: lint-imports
        name: import-linter
        description: Enforce the module layering contracts declared in pyproject.toml.
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        description: Type-check the packages, and their tests, configured in pyproject.toml.
        entry: uv run mypy
        language: system
        pass_filenames: false
