[project]
name = "aura-prototype"
version = "0.1.0"
description = "Aura Game Engine core features protoype"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Aaron Silinskas", email = "aaron@mindwidgets.com" }
]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "adafruit-board-toolkit>=1.1.2",
    # Pinned to the device firmware: CIRCUITPYTHON_VERSION in scripts/setup_mpy_cross.sh.
    # Bump both together.
    "circuitpython-stubs==10.3.1",
    "import-linter>=2.3",
    "mypy==2.4.1",
    # mpy-cross is NOT on PyPI for CircuitPython — the PyPI package is MicroPython's.
    # Download the CircuitPython binary via: scripts/setup_mpy_cross.sh
    # Binary lands at tools/mpy-cross (gitignored). Bump version with CircuitPython upgrades.
    "pre-commit>=4.0.0",
    "pyserial>=3.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.6",
    "types-pyserial>=3.5.0.20261104",
]

[tool.pytest.ini_options]
testpaths = ["app", "effects", "engine", "hardware", "magic", "packs", "scenes", "scripts"]
pythonpath = ["."]
addopts = "-p no:debugging"

[tool.ruff]
line-length = 100
exclude = ["scratch", "*.sh"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "N",   # pep8-naming conventions
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (likely bugs and design issues)
    "C4",  # flake8-comprehensions (cleaner list/dict/set expressions)
    "SIM", # flake8-simplify (redundant code patterns)
    "RUF", # ruff-native rules
    "ISC", # implicit string concatenation (mpy-cross incompatible)
]
ignore = [
    "B905",   # zip() without strict= — not available on CircuitPython
    "N817",   # VG is an established abbreviation for ValueGenerator throughout the codebase
    "RUF002", # mathematical symbols (×, –) in docstrings are intentional
    "RUF003", # mathematical symbols (×, –) in comments are intentional
    "RUF005", # (*a, b) unpacking in literals — mpy-cross rejects it; use concatenation
    "SIM105", # try/except/pass is clearer than contextlib.suppress for CircuitPython compat blocks
]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false  # mpy-cross rejects implicit concatenation even inside parens

[tool.ruff.lint.per-file-ignores]
# scripts/ and test dirs are CPython-only; ISC002 only matters for device-compiled code
"scripts/**" = ["ISC002"]
"**/tests/**" = ["ISC002"]

[tool.importlinter]
root_packages = ["effects", "engine", "magic", "packs", "hardware", "app"]
source_roots = ["."]

[[tool.importlinter.contracts]]
name = "engine must not import hardware"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["hardware"]

[[tool.importlinter.contracts]]
name = "hardware must not import engine runtime machinery"
type = "forbidden"
source_modules = ["hardware"]
forbidden_modules = [
    "engine.engine",
    "engine.scene",
    "engine.packs",
    "engine.timer",
    "engine.effects.manager",
    "engine.namespace",
]
# hardware.shared.tests.test_network_controls verifies HardwareNetworkControls'
# wiring into GameEngine.create_state (issue #608) — a legitimate cross-layer
# integration test, not a production dependency from hardware on engine.
ignore_imports = [
    "hardware.shared.tests.test_network_controls -> engine.engine",
]

[[tool.importlinter.contracts]]
name = "shipped code must not import test-only simulation code"
type = "protected"
protected_modules = ["app.simulation", "hardware.simulated"]
# Tests are not shipped (scripts/deploy.py excludes every tests/ directory), so a
# scene's tests may play it on the Simulation test harness, which itself builds
# on the Simulated device. Nothing else may import either.
allowed_importers = ["**.tests", "app.simulation"]

[tool.mypy]
python_version = "3.10"
files = ["app", "effects", "engine", "hardware", "magic", "packs", "scripts"]
# Test directories mypy does not check yet. Each later ticket of spec #1254
# deletes its own group once those tests are clean, and #1261 deletes this
# setting, so new test directories are checked by default.
exclude = [
    # #1256
    '^hardware/shared/ir_codecs/tests/',
    '^hardware/shared/tests/',
    # #1257
    '^hardware/circuitpython/tests/',
    '^hardware/simulated/tests/',
    # #1259
    '^effects/tests/',
    '^engine/tests/',
]
# Local stubs for modules circuitpython-stubs lacks; see typings/README.md.
mypy_path = "typings"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

# Test functions and fixtures need no annotations; their bodies stay checked.
[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_defs = false
