[project]
name = "aura-prototype"
version = "0.1.0"
description = "Aura Game Engine core features protoype"
readme = "README.md"
authors = [
    { name = "Aaron Silinskas", email = "aaron@mindwidgets.com" }
]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "import-linter>=2.3",
    # mpy-cross is NOT on PyPI for CircuitPython — the PyPI package is MicroPython's.
    # Download the CircuitPython binary via: scripts/setup_mpy_cross.sh
    # Binary lands at tools/mpy-cross (gitignored). Bump version with CircuitPython upgrades.
    "pre-commit>=4.0.0",
    "pyserial>=3.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["app", "effects", "engine", "hardware", "magic", "packs", "scenes", "scripts"]
pythonpath = ["."]
addopts = "-p no:debugging"

[tool.ruff]
line-length = 100
exclude = ["scratch", "*.sh"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "N",   # pep8-naming conventions
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (likely bugs and design issues)
    "C4",  # flake8-comprehensions (cleaner list/dict/set expressions)
    "SIM", # flake8-simplify (redundant code patterns)
    "RUF", # ruff-native rules
    "ISC", # implicit string concatenation (mpy-cross incompatible)
]
ignore = [
    "B905",   # zip() without strict= — not available on CircuitPython
    "N817",   # VG is an established abbreviation for ValueGenerator throughout the codebase
    "RUF002", # mathematical symbols (×, –) in docstrings are intentional
    "RUF003", # mathematical symbols (×, –) in comments are intentional
    "SIM105", # try/except/pass is clearer than contextlib.suppress for CircuitPython compat blocks
]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false  # mpy-cross rejects implicit concatenation even inside parens

[tool.ruff.lint.per-file-ignores]
# scripts/ and test dirs are CPython-only; ISC002 only matters for device-compiled code
"scripts/**" = ["ISC002"]
"**/tests/**" = ["ISC002"]

[tool.importlinter]
root_packages = ["effects", "engine", "magic", "packs", "hardware", "app"]
source_roots = ["."]

[[tool.importlinter.contracts]]
name = "engine must not import hardware"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["hardware"]

[[tool.importlinter.contracts]]
name = "hardware must not import engine runtime machinery"
type = "forbidden"
source_modules = ["hardware"]
forbidden_modules = [
    "engine.engine",
    "engine.scene",
    "engine.packs",
    "engine.timer",
    "engine.effects.manager",
]
# hardware.shared.tests.test_network_controls verifies HardwareNetworkControls'
# wiring into GameEngine.create_state (issue #608) — a legitimate cross-layer
# integration test, not a production dependency from hardware on engine.
ignore_imports = [
    "hardware.shared.tests.test_network_controls -> engine.engine",
]
