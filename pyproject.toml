[project]
name = "aura-prototype"
version = "0.1.0"
description = "Aura Game Engine core features protoype"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Aaron Silinskas", email = "aaron@mindwidgets.com" }
]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "adafruit-board-toolkit>=1.1.2",
    # Pinned to the device firmware: CIRCUITPYTHON_VERSION in scripts/setup_mpy_cross.sh.
    # Bump both together.
    "circuitpython-stubs==10.3.1",
    "import-linter>=2.3",
    "mypy==2.4.1",
    # mpy-cross is NOT on PyPI for CircuitPython — the PyPI package is MicroPython's.
    # Download the CircuitPython binary via: scripts/setup_mpy_cross.sh
    # Binary lands at tools/mpy-cross (gitignored). Bump version with CircuitPython upgrades.
    "pre-commit>=4.0.0",
    "pylint>=4.1.4",
    "pyserial>=3.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.17.5",
    "types-pyserial>=3.5.0.20261104",
]

[tool.pytest.ini_options]
testpaths = ["app", "effects", "engine", "hardware", "magic", "packs", "scenes", "scripts"]
pythonpath = ["."]
addopts = "-p no:debugging"

[tool.ruff]
line-length = 100
exclude = ["scratch", "*.sh"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "N",   # pep8-naming conventions
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (likely bugs and design issues)
    "C4",  # flake8-comprehensions (cleaner list/dict/set expressions)
    "SIM", # flake8-simplify (redundant code patterns)
    "RUF", # ruff-native rules
    "ISC", # implicit string concatenation (mpy-cross incompatible)
    "D",   # pydocstyle: docstring formatting (D1xx, which demand docstrings, are ignored)
    "PT",  # flake8-pytest-style
    "PGH", # pygrep-hooks (blanket type: ignore and noqa)
    "TC",  # flake8-type-checking: checker-only imports go under TYPE_CHECKING
]
ignore = [
    "D1",     # missing docstrings — comments-backpressure: a docstring only where it holds a contract
    "D205",   # summary spanning lines — the existing ones need rewording, not a blank line
    "D417",   # every parameter in Args: — python-docstrings lists only those that need it
    "B905",   # zip() without strict= — not available on CircuitPython
    "N817",   # VG is an established abbreviation for ValueGenerator throughout the codebase
    "RUF002", # mathematical symbols (×, –) in docstrings are intentional
    "RUF003", # mathematical symbols (×, –) in comments are intentional
    "RUF005", # (*a, b) unpacking in literals — mpy-cross rejects it; use concatenation
    "SIM105", # try/except/pass is clearer than contextlib.suppress for CircuitPython compat blocks
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false  # mpy-cross rejects implicit concatenation even inside parens

[tool.ruff.lint.per-file-ignores]
# scripts/ and test dirs are CPython-only; ISC002 only matters for device-compiled code
"scripts/**" = ["ISC002"]
# Tests never ship, so moving their imports under TYPE_CHECKING buys nothing.
"**/tests/**" = ["ISC002", "TC"]

# pylint runs only its duplicate-code check (R0801): ruff covers the rest.
[tool.pylint.main]
disable = ["all"]
enable = ["duplicate-code"]
persistent = false

[tool.pylint.reports]
score = false

[tool.pylint.similarities]
min-similarity-lines = 8

[tool.importlinter]
root_packages = ["effects", "engine", "magic", "packs", "hardware", "app", "scripts"]
source_roots = ["."]
# Puts external top-level modules in the graph for every contract, so a
# forbidden contract can name a CircuitPython-only module.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engine must not import hardware or app"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["hardware", "app"]

[[tool.importlinter.contracts]]
name = "hardware must not import engine runtime machinery"
type = "forbidden"
source_modules = ["hardware"]
forbidden_modules = [
    "engine.engine",
    "engine.scene",
    "engine.scene_runtime",
    "engine.packs",
    "engine.timer",
    "engine.effects.admin",
    "engine.effects.manager",
    "engine.namespace",
]

[[tool.importlinter.contracts]]
name = "shipped code must not import test-only simulation code"
type = "protected"
protected_modules = ["app.simulation", "hardware.simulated"]
# Tests are not shipped (the Ship list, scripts/ship_list.py, leaves out every
# tests/ directory), so a scene's tests may play it on the Simulation test
# harness, which itself builds on the Simulated device. Nothing else may import
# either.
allowed_importers = ["**.tests", "app.simulation"]

[[tool.importlinter.contracts]]
name = "the Scene boot must not import board-only hardware"
type = "forbidden"
# build_scene_boot also boots the Simulated device under CPython, so neither
# board-only hardware nor the CircuitPython-only modules it imports may load.
# Keep this list in step with the libraries hardware/circuitpython imports:
# a library missing here is not checked.
source_modules = ["app.scene_composition"]
forbidden_modules = [
    "hardware.circuitpython",
    "adafruit_drv2605",
    "adafruit_is31fl3741",
    "adafruit_lis3dh",
    "adafruit_mmc56x3",
    "adafruit_pioasm",
    "adafruit_rfm69",
    "audiobusio",
    "audiocore",
    "audiomixer",
    "board",
    "busio",
    "digitalio",
    "microcontroller",
    "neopixel",
    "pulseio",
    "rp2pio",
    "sdcardio",
    "storage",
    "usb_cdc",
]

[[tool.importlinter.contracts]]
name = "device packages must not import host scripts"
type = "forbidden"
# scripts/ (the Ship list, build, deploy) is CPython-only and never ships.
source_modules = ["effects", "engine", "magic", "packs", "hardware", "app"]
forbidden_modules = ["scripts"]

[tool.mypy]
python_version = "3.10"
files = ["app", "effects", "engine", "hardware", "magic", "packs", "scripts"]
# Local stubs for modules circuitpython-stubs lacks; see typings/README.md.
mypy_path = "typings"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

# Test functions and fixtures need no annotations; their bodies stay checked.
[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_defs = false
