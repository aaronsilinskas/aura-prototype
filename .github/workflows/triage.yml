# Automated triage: adding `needs-triage` to an issue (or dispatching a run for one) has Claude
# triage it read-only, then a deterministic step applies the decision. The work runs in the
# shared triage workflow from mindwidgets/workflows; this file owns only its triggers,
# permissions and concurrency. Its default inputs (the label doc, the project docs, sonnet,
# 10 turns) fit this repo, so it sets none. See the "Automated triage" section of
# docs/agents/triage-labels.md.
name: Triage

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to triage again (it must be open and carry needs-triage)
        required: true
        type: number

permissions: {}

# One run per issue at a time, never cancelling one in progress, so two events apply in order.
concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  triage:
    permissions:
      contents: read
      issues: write
    uses: mindwidgets/workflows/.github/workflows/triage.yml@11cfe9c10eda9ad0462de79d36a12a3c2df98cba # v1.0.0
    secrets:
      # API-key fallback: replace the line below with
      # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
